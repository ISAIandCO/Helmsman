name: Build and release Helmsman
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md']

permissions:
  contents: read

concurrency:
  group: helmsman-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.21.1'
          cache: npm
          cache-dependency-path: decky/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache: false
      - name: System build and test tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libwayland-egl1 libxkbcommon0 libxcb-cursor0 nftables iproute2 libxkbcommon-x11-0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xkb1 xvfb weston
          python -m pip install '.[gui,build]'
      - uses: actions/cache/restore@v4
        id: engines
        with:
          path: |
            build/engines
            build/sources
          key: engines-ubuntu22-go1.26.8-${{ hashFiles('scripts/build-engines.py', 'patches/*.patch') }}
      - name: Build pinned network engines and vendor corresponding sources
        if: steps.engines.outputs.cache-hit != 'true'
        run: python scripts/build-engines.py
      - uses: actions/cache/save@v4
        if: steps.engines.outputs.cache-hit != 'true'
        with:
          path: |
            build/engines
            build/sources
          key: ${{ steps.engines.outputs.cache-primary-key }}
      - name: Build Decky companion
        working-directory: decky
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check
          npm run build
          node ../scripts/check-decky.mjs
      - name: Imports, HWID, RPC, persistence and actual local transports
        env:
          HELMSMAN_ENGINES: ${{ github.workspace }}/build/engines
          HELMSMAN_CI: '1'
        run: |
          python -m unittest discover -s tests -v
          QT_QPA_PLATFORM=offscreen python scripts/check-gui.py
          bash -n scripts/install.sh scripts/uninstall.sh scripts/test-netns.sh
      - name: Real TUN, DNS, UDP, routing, crash protection and cleanup
        run: sudo env HELMSMAN_ENGINES="$PWD/build/engines" bash scripts/test-netns.sh "$(command -v python)"
      - name: Build installable application and archives
        run: |
          python scripts/runtime-sources.py
          python scripts/package.py
          QT_QPA_PLATFORM=offscreen dist/Helmsman/Helmsman ctl --help
          python scripts/check-artifacts.py
          sudo env HELMSMAN_CI=1 "$(command -v python)" scripts/check-storage.py
          python scripts/check-install.py
      - uses: actions/upload-artifact@v4
        with:
          name: helmsman-${{ github.sha }}
          path: dist/release/
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-${{ github.sha }}
          path: test-results/
          if-no-files-found: ignore

  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: helmsman-${{ github.sha }}
          path: release
      - name: Publish versioned release once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(cat VERSION)
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag exists; bump VERSION for the next release."
            exit 0
          fi
          if [[ "$version" == *-* ]]; then
            release_flags=(--prerelease --latest=false)
          else
            release_flags=(--latest)
          fi
          gh release create "$tag" release/* --target "$GITHUB_SHA" "${release_flags[@]}" --title "Helmsman $version" --notes-file RELEASE_NOTES.md
