[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "helmsman-vpn"
version = "0.1.0a5"
description = "Steam Deck connection manager"
requires-python = ">=3.11"
license = "GPL-3.0-only"
dependencies = []

[project.optional-dependencies]
gui = ["PySide6==6.9.3"]
build = ["PyInstaller==6.16.0", "pyinstaller-hooks-contrib==2026.8"]

[project.scripts]
helmsman = "helmsman.gui:main"
helmsmand = "helmsman.daemon:main"
helmsmanctl = "helmsman.rpc:main"

[tool.setuptools.packages.find]
include = ["helmsman*"]

[tool.setuptools.package-data]
helmsman = ["warp-obfuscation.json"]
